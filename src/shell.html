<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Campaign Guidelines</title>
<meta name="description" content="Artist Influence clipping campaign guidelines.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:hsl(225 18% 6%); --s0:hsl(225 16% 7.5%); --s1:hsl(225 16% 9%); --s2:hsl(225 14% 12.5%); --s3:hsl(225 12% 17%);
  --line:hsl(225 12% 19%); --line-2:hsl(225 12% 25%);
  --text:hsl(0 0% 96%); --text-2:hsl(225 10% 80%); --muted:hsl(225 8% 62%);
  --red:hsl(0 84% 54%); --red-2:hsl(0 90% 64%); --red-wash:hsla(0 84% 54% / .12);
  --ok:hsl(152 52% 52%); --ok-wash:hsla(152 52% 52% / .12);
  --warn:hsl(36 92% 60%); --warn-wash:hsla(36 92% 60% / .12);
  --head:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none !important;transition:none !important}}
body{margin:0;background:var(--bg);color:var(--text);font:400 15.5px/1.62 var(--body);overflow-x:clip}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 560px at 88% -10%,hsla(0 84% 54% / .18),transparent 62%),radial-gradient(760px 520px at -12% 108%,hsla(355 80% 22% / .34),transparent 62%)}
a{color:var(--red-2);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%}
code{font-family:var(--mono);font-size:.86em;background:var(--s3);border:1px solid var(--line);padding:.08em .38em;border-radius:6px;color:var(--text-2);word-break:break-word}
strong{font-weight:600;color:var(--text)}
p{margin:0 0 12px}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,32px)}

/* gate */
.gate{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate-card{width:100%;max-width:400px;text-align:center;background:linear-gradient(145deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:24px;padding:36px 28px 30px}
.gate-card img{height:48px;margin-bottom:18px}
.gate-card h1{font:800 26px/1.05 var(--head);letter-spacing:-.02em;margin:0 0 6px}
.gate-card p{color:var(--muted);font-size:14px;margin:0 0 20px}
.gate-row{display:flex;gap:8px}
.gate-row input{flex:1;min-width:0;height:48px;border-radius:999px;border:1px solid var(--line-2);background:var(--s0);color:var(--text);padding:0 18px;font:500 16px var(--body);outline:none}
.gate-row input:focus{border-color:var(--red)}
.gate-err{color:var(--red-2);font-size:13px;min-height:20px;margin-top:10px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;padding-top:var(--top);background:hsla(225 18% 6% / .86);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--text)}
.brand:hover{text-decoration:none}
.brand img{height:26px;display:block}
.brand span{font:800 14px/1 var(--head);white-space:nowrap}
.brand span b{color:var(--red)}
.viewtoggle{margin-left:auto;display:flex;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px}
.viewtoggle button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 13px/1 var(--body);padding:9px 14px;border-radius:999px;cursor:pointer;min-height:36px}
.viewtoggle button.on{background:var(--red);color:#fff}
@media (max-width:620px){.viewtoggle{margin-left:0;width:100%}.viewtoggle button{flex:1}}

/* type */
.eyebrow{font:600 11.5px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin:0 0 12px}
h1,h2,h3,h4{font-family:var(--head);margin:0;color:var(--text)}
h1{font-weight:800;font-size:clamp(2.1rem,5vw,3.4rem);line-height:1;letter-spacing:-.035em}
h2{font-weight:800;font-size:clamp(1.5rem,3vw,2.05rem);line-height:1.05;letter-spacing:-.025em;margin-bottom:10px}
h3{font-weight:700;font-size:1.1rem;line-height:1.25;margin-bottom:8px}
h4{font-weight:700;font-size:.97rem;margin-bottom:6px}
.accent{color:var(--red)}
.lede{font-size:1.06rem;color:var(--text-2);max-width:760px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.section{padding-block:clamp(28px,4vw,44px);border-top:1px solid var(--line)}
.section-head{max-width:780px;margin-bottom:20px}
.section-head p{color:var(--text-2)}
.section-head .eyebrow{color:var(--red)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.card{background:linear-gradient(145deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.card.flat{background:var(--s1)}
.card.red{background:linear-gradient(145deg,hsla(0 84% 54% / .15),hsla(355 80% 22% / .2));border-color:hsla(0 84% 54% / .36)}
.card .kicker{font:600 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:9px}
.card p:last-child,.card ul:last-child{margin-bottom:0}
ul.clean,ol.clean{margin:0;padding-left:1.15em}
ul.clean li,ol.clean li{margin:0 0 6px}
ul.clean li::marker{color:var(--red)}
.tag{display:inline-block;font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--text-2);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:hsla(152 52% 52% / .45);background:var(--ok-wash)}
.tag.warn{color:var(--warn);border-color:hsla(36 92% 60% / .45);background:var(--warn-wash)}
.tag.no{color:var(--red-2);border-color:hsla(0 84% 54% / .5);background:var(--red-wash)}
.tag.sample{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--s1)}
table{width:100%;border-collapse:collapse;font-size:13.8px}
th,td{text-align:left;vertical-align:top;padding:11px 13px;border-bottom:1px solid var(--line)}
th{font:600 10.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--s2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.callout{border-radius:16px;padding:15px 17px;border:1px solid hsla(0 84% 54% / .4);background:var(--red-wash)}
.callout.info{border-color:var(--line-2);background:var(--s1)}
.callout.warn{border-color:hsla(36 92% 60% / .45);background:var(--warn-wash)}
.callout p:last-child{margin-bottom:0}
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:999px;background:var(--red);color:#fff;font:700 13.5px/1 var(--body);text-decoration:none}
.btn:hover{filter:brightness(1.08);text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.sm{min-height:34px;padding:0 14px;font-size:12.5px}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--text)}
.btn.done{background:var(--ok)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.copy{border:1px solid var(--line);border-radius:16px;background:var(--s0);overflow:hidden}
.copy-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);background:var(--s1)}
.copy-head span{font:600 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.copy pre{margin:0;padding:15px 17px;white-space:pre-wrap;word-break:break-word;font:400 13.6px/1.6 var(--body);color:var(--text-2);max-height:520px;overflow:auto}

/* header block */
.chead{padding-block:clamp(26px,4vw,40px) 6px}
.chead h1{margin-bottom:12px}
.cmeta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;border:1px dashed var(--line-2);border-radius:14px;padding:12px 16px;background:var(--s0);color:var(--muted);font-size:13.3px}
.banner b{color:var(--text-2);font-weight:600}

/* rules strip */
.rulestrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:860px){.rulestrip{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.rulestrip{grid-template-columns:minmax(0,1fr)}}
.rulestrip div{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.rulestrip b{display:block;font:800 1rem/1.2 var(--head);margin-bottom:3px}
.rulestrip span{color:var(--muted);font-size:13px}

/* song card */
.song{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--s2),var(--s1));overflow:hidden}
.song-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;justify-content:space-between;padding:20px 22px 0}
.song-head h3{font-size:1.32rem;margin:0}
.song-body{padding:16px 22px 22px;display:grid;gap:16px}
.startline{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px}
.startbig{font:800 2.6rem/1 var(--head);letter-spacing:-.03em;color:#fff}
.startbig em{font-style:normal;color:var(--red)}
.startnote{color:var(--muted);font-size:13.5px}
.twostart{display:flex;flex-wrap:wrap;gap:10px;width:100%}
.twostart>div{flex:1;min-width:150px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.twostart b{display:block;font:600 10.5px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.twostart em{font:800 2.2rem/1 var(--head);font-style:normal;letter-spacing:-.03em;color:var(--red)}
.twostart span{display:block;color:var(--muted);font-size:12.5px;margin-top:6px}
@media (max-width:520px){.twostart em{font-size:1.9rem}}
.marks{display:flex;flex-wrap:wrap;gap:8px}
.mark{border:1px solid var(--line-2);border-radius:12px;padding:8px 12px;background:var(--s0);min-width:132px}
.mark b{display:block;font:600 10.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.mark span{font:800 1.05rem/1 var(--head)}
.mark.hot span{color:var(--red-2)}
.mark.end span{color:var(--ok)}

/* player */
.player{border:1px solid var(--line);border-radius:16px;background:var(--s0);padding:14px 16px}
.player canvas{width:100%;height:96px;display:block;cursor:pointer;border-radius:8px}
.ptools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.ptime{font:600 12.5px/1 var(--mono);color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.plegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font:600 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.plegend i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.plegend i::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--line-2)}
.plegend i.s::before{background:#fff}
.plegend i.d::before{background:var(--red)}
.plegend i.e::before{background:var(--ok)}

/* cap meter */
.cap{border:1px solid var(--line);border-radius:16px;background:var(--s0);padding:15px 17px}
.cap-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:10px}
.cap-top b{font:800 1.05rem/1 var(--head)}
.cap-bar{height:12px;border-radius:999px;background:var(--s3);overflow:hidden;border:1px solid var(--line)}
.cap-fill{height:100%;width:0;background:linear-gradient(90deg,var(--ok),hsl(120 45% 45%));transition:width .5s}
.song[data-cap="almost"] .cap-fill{background:linear-gradient(90deg,var(--warn),hsl(24 90% 55%))}
.song[data-cap="closed"] .cap-fill{background:linear-gradient(90deg,var(--red),hsl(355 70% 40%))}
.cap-note{margin-top:9px;font-size:13.2px;color:var(--muted)}
.song[data-cap="closed"] .song-body{opacity:.62}
.song[data-cap="closed"] .closed-note{display:block}
.closed-note{display:none;border:1px solid hsla(0 84% 54% / .5);background:var(--red-wash);border-radius:12px;padding:11px 14px;color:var(--text);font-size:13.6px}

/* claimables */
.claimlist{display:grid;gap:8px}
.claim{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;background:var(--s1);padding:12px 14px}
.claim .body{flex:1;min-width:200px}
.claim .body b{display:block;font-weight:600;color:var(--text)}
.claim .body span{color:var(--muted);font-size:13px}
.claim .state{font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.claim[data-state="mine"]{border-color:hsla(152 52% 52% / .5);background:linear-gradient(145deg,hsla(152 52% 52% / .1),var(--s1))}
.claim[data-state="mine"] .state{color:var(--ok);border-color:hsla(152 52% 52% / .45)}
.claim[data-state="taken"]{opacity:.72}
.claim[data-state="taken"] .state{color:var(--warn);border-color:hsla(36 92% 60% / .4)}
.claim input.link{flex:1;min-width:170px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--s0);color:var(--text);padding:0 12px;font:400 13px var(--body);outline:none}
.claim input.link:focus{border-color:var(--red)}
/* claimed by me floats to the top of its list, claimed by anyone else leaves the list */
.claim[data-state="mine"],.asset[data-state="mine"]{order:-1}
.minehead{order:-2;font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ok)}
.whoami{display:flex;align-items:center;gap:8px;font-size:12.6px;color:var(--muted)}
.whoami input{height:34px;width:158px;border-radius:999px;border:1px solid var(--line-2);background:var(--s0);color:var(--text);padding:0 12px;font:400 13px var(--body);outline:none}
.whoami input:focus{border-color:var(--red)}
.mehandle[data-warn="1"]{border-color:var(--red);box-shadow:0 0 0 3px hsla(354 78% 54% / .2)}
.needmsg{color:var(--red);font-size:12.4px;font-weight:600}
.assets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.assets{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.assets{grid-template-columns:minmax(0,1fr)}}
.asset{border:1px solid var(--line);border-radius:16px;background:var(--s1);display:flex;flex-direction:column}
.asset .thumb{aspect-ratio:9/12;background:linear-gradient(150deg,var(--s3),var(--s0));display:grid;place-items:center;color:var(--muted);font:600 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:10px}
.asset .meta{padding:12px 14px;display:grid;gap:8px}
.asset .meta b{font-weight:600}
.asset .meta span{color:var(--muted);font-size:12.8px}
.asset[data-state="taken"]{opacity:.7}
.identity{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;font-size:13.4px;color:var(--muted)}
.identity input{height:38px;border-radius:999px;border:1px solid var(--line-2);background:var(--s0);color:var(--text);padding:0 14px;font:400 14px var(--body);outline:none;min-width:190px}
.identity input:focus{border-color:var(--red)}

/* bars (ops insight) */
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:150px 1fr 74px;align-items:center;gap:10px;font-size:13.4px}
@media (max-width:560px){.bar{grid-template-columns:110px 1fr 62px;font-size:12.6px}}
.bar .track{height:22px;border-radius:6px;background:var(--s3);overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--red),hsl(355 70% 38%));border-radius:6px}
.bar .val{text-align:right;font:600 13px/1 var(--mono);color:var(--text-2);font-variant-numeric:tabular-nums}
.bar.dim .fill{background:var(--s3);border:1px solid var(--line-2)}

.foot{position:relative;z-index:1;border-top:1px solid var(--line);padding-block:24px 40px;color:var(--muted);font-size:13px}
/* modals */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:hsla(225 20% 3% / .72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-card{width:min(860px,100%);max-height:88vh;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line-2);border-radius:22px;overflow:hidden;box-shadow:0 30px 90px hsla(0 0% 0% / .55)}
.modal-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--s0)}
.modal-head h3{margin:0;font-size:1.1rem}
.modal-head .count{font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.modal-head .spacer{flex:1}
.modal-body{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.modal-body > *{flex:0 0 auto}
.modal-body::-webkit-scrollbar{width:10px}
.modal-body::-webkit-scrollbar-thumb{background:var(--s3);border-radius:8px}
.searchbar{flex:1;min-width:150px;height:38px;border-radius:999px;border:1px solid var(--line-2);background:var(--s1);color:var(--text);padding:0 14px;font:400 14px var(--body);outline:none}
.searchbar:focus{border-color:var(--red)}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);background:var(--s0);color:var(--muted);font-size:12.6px}
.iconbtn{appearance:none;border:1px solid var(--line-2);background:var(--s1);color:var(--text);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center}
.openrow{display:flex;flex-wrap:wrap;gap:10px}
.openrow .btn{flex:1;min-width:210px}
.pill-note{font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.suggest{border-top:1px dashed var(--line-2);margin-top:8px;padding-top:8px;display:grid;gap:4px}
.suggest span{font-size:12.8px;color:var(--text-2)}
.suggest b{font:600 10px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block}
.remixed{border-color:hsla(36 92% 60% / .5) !important}
.etype{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--s2),var(--s1));padding:18px 20px}
.etype h3{margin-bottom:4px}
.etype .why{font-size:13.2px;color:var(--muted);margin-bottom:12px}
.etype ul{margin:0;padding-left:1.1em}
.etype li{margin-bottom:7px;font-size:14px}
.etype li b{color:#fff}
.etype .refs{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
.now{display:inline-block;font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px solid hsla(36 92% 60% / .45);background:var(--warn-wash);border-radius:999px;padding:4px 7px;margin-right:6px;vertical-align:1px}
body:not(.view-ops) [data-view="ops"]{display:none !important}
body.view-ops [data-view="clipper"]{display:none !important}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="gate-card" id="gate-form" autocomplete="off">
    <img src="assets/wordmark.png" alt="Artist Influence">
    <h1>Campaign Guidelines</h1>
    <p>Reference build. Enter the team code.</p>
    <div class="gate-row">
      <input id="gate-pass" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Team code" aria-label="Team code">
      <button class="btn" type="submit">Open</button>
    </div>
    <div class="gate-err" id="gate-err" role="alert"></div>
  </form>
</div>
<div id="app" hidden></div>
<script>
const D = __PAYLOAD__;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
};
async function unlock(code){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(D.salt), iterations:D.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(D.iv)}, key, b64(D.ct)));
}
async function openApp(code, quiet){
  try {
    const html = await unlock(code.trim().toLowerCase());
    store.set('sfc-code', code.trim().toLowerCase());
    const app = document.getElementById('app');
    app.innerHTML = html;
    document.getElementById('gate').hidden = true;
    app.hidden = false;
    init();
  } catch (e) { if (!quiet) { document.getElementById('gate-err').textContent = 'That code did not work.'; } }
}
document.getElementById('gate-form').addEventListener('submit', e => { e.preventDefault(); openApp(document.getElementById('gate-pass').value, false); });
const saved = store.get('sfc-code');
if (saved) { openApp(saved, true); }

function init(){
  /* ---------- view toggle ---------- */
  const setView = v => {
    document.body.classList.toggle('view-ops', v === 'ops');
    document.querySelectorAll('[data-setview]').forEach(b => b.classList.toggle('on', b.dataset.setview === v));
    store.set('cg-view', v);
    window.dispatchEvent(new Event('resize'));
  };
  document.querySelectorAll('[data-setview]').forEach(b => b.addEventListener('click', () => setView(b.dataset.setview)));
  setView(location.hash.replace('#','') === 'ops' ? 'ops' : (store.get('cg-view') || 'clipper'));

  /* ---------- copy buttons ---------- */
  document.querySelectorAll('[data-copy]').forEach(btn => btn.addEventListener('click', () => {
    const el = document.querySelector(btn.dataset.copy);
    if (!el) return;
    const text = el.innerText.trim();
    const done = () => { const old = btn.textContent; btn.textContent = 'Copied'; btn.classList.add('done'); setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1500); };
    if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, fb); } else { fb(); }
    function fb(){ const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e){} ta.remove(); }
  }));

  /* ---------- waveform players ---------- */
  const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60); const sec = Math.floor(s % 60); return m + ':' + String(sec).padStart(2, '0'); };
  document.querySelectorAll('[data-player]').forEach(root => {
    const peaks = JSON.parse(document.getElementById(root.dataset.peaks).textContent).peaks;
    const offset = parseFloat(root.dataset.offset);      // song seconds at file time 0
    const start = parseFloat(root.dataset.start);        // song seconds
    const drop = parseFloat(root.dataset.drop);
    const end = parseFloat(root.dataset.end);
    const canvas = root.querySelector('canvas');
    const timeEl = root.querySelector('.ptime');
    const audio = new Audio(root.dataset.src);
    audio.preload = 'auto';
    let dur = parseFloat(root.dataset.dur) || 60;
    let stopAt = null;
    const draw = () => {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const w = rect.width, h = rect.height, mid = h / 2;
      ctx.clearRect(0, 0, w, h);
      const x = t => ((t - offset) / dur) * w;   // song seconds -> px
      ctx.fillStyle = 'rgba(217,30,54,.14)';
      ctx.fillRect(x(start), 0, x(end) - x(start), h);
      const n = peaks.length, bw = w / n;
      for (let i = 0; i < n; i++) {
        const tSong = offset + (i / n) * dur;
        const inWin = tSong >= start && tSong <= end;
        const played = audio.currentTime + offset >= tSong;
        ctx.fillStyle = inWin ? (played ? '#ff6b7a' : 'rgba(217,30,54,.85)') : (played ? 'rgba(255,255,255,.45)' : 'rgba(255,255,255,.2)');
        const ph = Math.max(2, peaks[i] * (h - 10));
        ctx.fillRect(i * bw, mid - ph / 2, Math.max(1, bw - 1), ph);
      }
      const line = (t, color, label) => {
        const px = x(t);
        ctx.fillStyle = color; ctx.fillRect(px - 1, 0, 2, h);
        if (label) { ctx.font = '600 10px ui-monospace, Menlo, monospace'; ctx.fillStyle = color; ctx.textAlign = px > w - 40 ? 'right' : 'left'; ctx.fillText(label, px > w - 40 ? px - 4 : px + 4, 11); }
      };
      line(start, '#ffffff', 'START');
      line(drop, '#d91e36', 'DROP');
      line(end, '#57c98a', '15s');
      const cur = audio.currentTime + offset;
      if (cur > offset) { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(x(cur) - 1, 0, 2, h); }
      timeEl.textContent = fmt(cur) + ' / ' + fmt(offset + dur);
    };
    const atStart = () => { try { audio.currentTime = start - offset; } catch (e) {} };
    audio.addEventListener('loadedmetadata', () => { if (audio.duration && isFinite(audio.duration)) { dur = audio.duration; } atStart(); draw(); });
    audio.addEventListener('timeupdate', () => { if (stopAt !== null && audio.currentTime >= stopAt) { audio.pause(); stopAt = null; } draw(); });
    audio.addEventListener('ended', draw);
    audio.addEventListener('pause', () => { root.querySelectorAll('[data-act]').forEach(b => { b.textContent = b.dataset.label; }); });
    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      audio.currentTime = Math.max(0, Math.min(dur - .05, ((e.clientX - rect.left) / rect.width) * dur));
      stopAt = null; draw();
    });
    root.querySelectorAll('[data-act]').forEach(btn => {
      btn.dataset.label = btn.textContent;
      btn.addEventListener('click', () => {
        if (!audio.paused) { audio.pause(); return; }
        const go = () => {
          atStart();
          stopAt = btn.dataset.act === 'window' ? (end - offset) : null;
          audio.play().then(() => {
            if (!audio.paused) { btn.textContent = 'Pause'; }
            if (!audio.paused && Math.abs(audio.currentTime - (start - offset)) > 0.6) { atStart(); }
          }, () => {});
        };
        if (audio.readyState >= 1) { go(); } else { audio.addEventListener('loadedmetadata', go, { once: true }); audio.load(); }
      });
    });
    window.addEventListener('resize', draw);
    draw();
  });

  /* ---------- cap state preview ---------- */
  const capData = { open: ['640,112', '64', 'Open', 'Post away. Check back before you post again.'],
                    almost: ['902,540', '90', 'Almost full', 'Close to the cap. Post today, and check again before your next one.'],
                    closed: ['1,004,880', '100', 'Closed', 'Do not post for this song. Clips posted after it closed are rejected (no strike).'] };
  document.querySelectorAll('[data-capstate]').forEach(btn => btn.addEventListener('click', () => {
    const st = btn.dataset.capstate, d = capData[st];
    document.querySelectorAll('[data-capstate]').forEach(b => b.classList.toggle('on', b === btn));
    document.querySelectorAll('.song[data-cap]').forEach(song => {
      song.dataset.cap = st;
      song.querySelector('.cap-fill').style.width = Math.min(100, +d[1]) + '%';
      song.querySelector('.cap-count').textContent = d[0];
      song.querySelector('.cap-pct').textContent = d[1] + '%';
      const chip = song.querySelector('.cap-state');
      chip.textContent = d[2];
      chip.className = 'tag cap-state ' + (st === 'open' ? 'ok' : st === 'almost' ? 'warn' : 'no');
      song.querySelector('.cap-note').textContent = d[3];
    });
  }));

  /* ---------- claims (demo: this browser only) ---------- */
  const readClaims = () => { try { return JSON.parse(store.get('cg-claims') || '{}'); } catch (e) { return {}; } };
  const writeClaims = c => store.set('cg-claims', JSON.stringify(c));
  const getMe = () => (store.get('cg-me') || '').trim();
  const meFields = () => Array.from(document.querySelectorAll('.mehandle'));
  meFields().forEach(f => {
    f.value = getMe();
    f.addEventListener('input', () => {
      const v = f.value.trim();
      store.set('cg-me', v);
      meFields().forEach(o => { o.removeAttribute('data-warn'); if (o !== f && o.value !== v) { o.value = v; } });
      document.querySelectorAll('.needmsg').forEach(m => { m.hidden = true; });
      paint();
    });
  });
  const rowVisible = row => { row.hidden = row.dataset.gone === '1' || row.dataset.miss === '1'; };
  function paint(){
    const claims = readClaims();
    const me = getMe().replace(/^@/, '').toLowerCase();
    const showTaken = document.body.dataset.showTaken === '1';
    const tally = {};
    document.querySelectorAll('[data-claim]').forEach(row => {
      const id = row.dataset.claim;
      const rec = claims[id] || (row.dataset.owner ? { owner: row.dataset.owner, sample: true } : null);
      const stateEl = row.querySelector('.state');
      const btn = row.querySelector('[data-claimbtn]');
      const linkWrap = row.querySelector('.linkwrap');
      const owner = rec ? String(rec.owner).replace(/^@/, '') : null;
      const mine = !!(owner && me && owner.toLowerCase() === me);
      const state = !rec ? 'free' : (mine ? 'mine' : 'taken');
      row.dataset.state = state;
      row.dataset.gone = (state === 'taken' && !showTaken) ? '1' : '';
      rowVisible(row);
      const kind = id.replace(/-\d+$/, '');
      const t = tally[kind] || (tally[kind] = { free: 0, mine: 0, taken: 0 });
      t[state] += 1;
      if (stateEl) { stateEl.textContent = !rec ? 'Available' : (mine ? (rec.postUrl ? 'Yours, posted' : 'Yours, add your link') : 'Taken by @' + owner); }
      if (btn) { btn.textContent = mine ? 'Release' : 'Claim'; btn.disabled = state === 'taken'; }
      if (linkWrap) { linkWrap.hidden = !mine; const i = linkWrap.querySelector('input'); if (i && rec && rec.postUrl && i.value !== rec.postUrl) { i.value = rec.postUrl; } }
    });
    Object.keys(tally).forEach(kind => {
      const t = tally[kind];
      document.querySelectorAll('[data-count="' + kind + '"]').forEach(el => { el.textContent = t.free; });
      document.querySelectorAll('[data-countlabel="' + kind + '"]').forEach(el => {
        el.textContent = t.free + ' left' + (t.mine ? ' and ' + t.mine + ' yours' : '') + (t.taken ? ' and ' + t.taken + ' taken' : '');
      });
      document.querySelectorAll('[data-minehead="' + kind + '"]').forEach(el => { el.hidden = !t.mine; });
    });
  }
  function attachClaims(root){
    (root || document).querySelectorAll('[data-claimbtn]').forEach(btn => { if (btn.dataset.bound) return; btn.dataset.bound = '1'; btn.addEventListener('click', () => {
      const row = btn.closest('[data-claim]');
      if (!row) return;
      const me = getMe();
      if (!me) {
        const scope = btn.closest('.modal') || document;
        const field = scope.querySelector('.mehandle') || document.getElementById('me-handle');
        const msg = scope.querySelector('.needmsg');
        if (field) { field.dataset.warn = '1'; field.focus(); }
        if (msg) { msg.hidden = false; }
        return;
      }
      const claims = readClaims();
      const id = row.dataset.claim;
      if (claims[id]) { delete claims[id]; } else { claims[id] = { owner: me.replace(/^@/, ''), at: Date.now() }; }
      writeClaims(claims); paint();
    }); });
    (root || document).querySelectorAll('.linkwrap input').forEach(inp => { if (inp.dataset.bound) return; inp.dataset.bound = '1'; inp.addEventListener('change', () => {
      const row = inp.closest('[data-claim]');
      const claims = readClaims();
      if (claims[row.dataset.claim]) { claims[row.dataset.claim].postUrl = inp.value.trim(); writeClaims(claims); paint(); }
    }); });
  }
  attachClaims(document);
  const reset = document.getElementById('reset-claims');
  if (reset) { reset.addEventListener('click', () => { writeClaims({}); paint(); }); }
  const seeTaken = document.getElementById('toggle-taken');
  if (seeTaken) { seeTaken.addEventListener('click', () => {
    const on = document.body.dataset.showTaken === '1';
    document.body.dataset.showTaken = on ? '' : '1';
    seeTaken.classList.toggle('on', !on);
    seeTaken.textContent = on ? 'Show claimed' : 'Hide claimed';
    paint();
  }); }
  paint();

  /* ---------- modals ---------- */
  const openModal = id => { const m = document.getElementById(id); if (!m) return; m.hidden = false; document.body.style.overflow = 'hidden'; const s = m.querySelector('.searchbar'); if (s) { setTimeout(() => s.focus(), 30); } };
  const closeModals = () => { document.querySelectorAll('.modal').forEach(m => { m.hidden = true; }); document.body.style.overflow = ''; };
  document.querySelectorAll('[data-modal-open]').forEach(b => b.addEventListener('click', () => openModal(b.dataset.modalOpen)));
  document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-modal-close]')) { closeModals(); } }));
  window.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModals(); } });

  /* ---------- line generator ---------- */
  const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  function buildLines(spec, count, seed){
    const rnd = mulberry(seed);
    const pick = arr => arr[Math.floor(rnd() * arr.length) % arr.length];
    const out = [], seen = new Set();
    let guard = 0;
    while (out.length < count && guard++ < count * 60) {
      let line = pick(spec.templates).replace(/\{(\w+)\}/g, (m, k) => (spec.slots[k] ? pick(spec.slots[k]) : m));
      line = line.replace(/\s+/g, ' ').trim();
      if (spec.lowercase && rnd() < spec.lowercase) { line = line.toLowerCase(); }
      const key = line.toLowerCase();
      if (!seen.has(key)) { seen.add(key); out.push(line); }
    }
    return out;
  }
  const claimRow = (id, body, sub, extra) => `<div class="claim" data-claim="${id}"><div class="body"><b>${body}</b>${sub ? `<span>${sub}</span>` : ''}${extra || ''}</div><span class="state">Available</span><button class="btn sm" data-claimbtn>Claim</button><span class="linkwrap" hidden><input class="link" type="url" placeholder="Paste your post link"></span></div>`;

  const bankEl = document.getElementById('line-banks');
  if (bankEl) {
    const banks = JSON.parse(bankEl.textContent);
    const state = {};
    ['text','caption'].forEach(kind => {
      const spec = banks[kind];
      const box = document.getElementById('list-' + kind);
      const lines = buildLines(spec, spec.count || 250, spec.seed || 7);
      state[kind] = { lines, seed: (spec.seed || 7) + 991, n: lines.length };
      const render = () => {
        box.innerHTML = '<div class="minehead" data-minehead="' + kind + '" hidden>Yours</div>' +
          state[kind].lines.map((l, i) => claimRow(kind + '-' + (i + 1), l, kind === 'caption' ? spec.credit : '')).join('');
        attachClaims(box);
        paint();
      };
      render();
      const search = document.querySelector(`[data-search="${kind}"]`);
      if (search) { search.addEventListener('input', () => { const q = search.value.toLowerCase().trim(); box.querySelectorAll('.claim').forEach(r => { r.dataset.miss = (q && !r.innerText.toLowerCase().includes(q)) ? '1' : ''; rowVisible(r); }); }); }
      const remix = document.querySelector(`[data-remix="${kind}"]`);
      if (remix) { remix.addEventListener('click', () => {
        const fresh = buildLines(spec, state[kind].n + 12, state[kind].seed).filter(l => !state[kind].lines.includes(l)).slice(0, 12);
        state[kind].seed += 17;
        state[kind].lines = fresh.concat(state[kind].lines);
        render();
        box.querySelectorAll('.claim').forEach((r, i) => { if (i < fresh.length) { r.classList.add('remixed'); } });
        box.scrollTop = 0;
        remix.textContent = 'Remixed 12 new';
        setTimeout(() => { remix.textContent = 'Remix 12 new'; }, 1800);
      }); }
    });
  }

  /* ---------- spacebar play and pause ---------- */
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space' && e.key !== ' ') return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable || t.tagName === 'BUTTON' || t.tagName === 'A')) return;
    const btn = document.querySelector('[data-act="window"]');
    if (!btn) return;
    e.preventDefault();
    btn.click();
  });
}
</script>
</body>
</html>
